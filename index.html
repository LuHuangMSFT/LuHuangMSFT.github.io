<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lu Huang. Find my work and connect with me on GitHub.">
    <meta name="theme-color" content="#131519">
    <title>Lu Huang</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: dark;
        --background: #131519;
        --text: #f3f4f6;
        --muted: #9da5b3;
        --accent: #b6d0ff;
        --accent-line: #8fb7ff;
        --link-border: #4e6487;
        --link-hover: #202b3d;
        --rule: #30343c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        align-items: center;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--accent);
        color: var(--background);
      }

      .page {
        width: min(100%, 1040px);
        margin-inline: auto;
        padding: 40px 64px;
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        color: var(--muted);
        font-family: Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        line-height: 1.6;
      }

      .brand-line {
        width: 32px;
        height: 3px;
        background: var(--accent-line);
      }

      .eyebrow {
        font-size: 12px;
        line-height: 1.6;
        font-family: Consolas, "Liberation Mono", monospace;
        color: var(--muted);
      }

      main {
        padding-block: clamp(64px, 10vh, 112px);
      }

      .intro {
        max-width: 760px;
      }

      .eyebrow {
        margin: 0 0 16px;
      }

      h1 {
        margin: 0 0 18px -0.045em;
        font-size: clamp(64px, 9vw, 104px);
        font-weight: 600;
        letter-spacing: -0.065em;
        line-height: 1.05;
      }

      .description {
        max-width: 390px;
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.75;
      }

      .github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 52px;
        margin-top: 28px;
        padding: 12px 18px;
        border: 1px solid var(--link-border);
        border-radius: 2px;
        color: var(--accent);
        font-size: 15px;
        font-weight: 500;
        line-height: 1.5;
        text-decoration: none;
      }

      .github-link:hover {
        border-color: var(--accent-line);
        background: var(--link-hover);
      }

      .github-link:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }

      .github-link svg {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
      }

      footer {
        padding-top: 20px;
        border-top: 1px solid var(--rule);
        color: var(--muted);
        font-family: Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        line-height: 1.6;
      }

      footer p {
        margin: 0;
      }

      @media (max-width: 600px) {
        .page {
          padding: 32px 24px;
        }

        main {
          padding-block: 64px;
        }

        h1 {
          font-size: clamp(52px, 12vw, 72px);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <span>LU HUANG</span>
        <span class="brand-line" aria-hidden="true"></span>
      </header>

      <main>
        <div class="intro">
          <p class="eyebrow">Hello, I'm</p>
          <h1>Lu Huang<span aria-hidden="true">.</span></h1>
          <p class="description">Find my work and connect with me on GitHub.</p>
          <a class="github-link" href="https://github.com/LuHuangMSFT">
            Connect on GitHub
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M7 17 17 7M7 7h10v10"></path>
            </svg>
          </a>
        </div>
      </main>

      <footer>
        <p>luhuangmsft.github.io</p>
      </footer>
    </div>
  </body>
</html>
