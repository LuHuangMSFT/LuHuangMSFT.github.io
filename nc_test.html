<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is It Christmas?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px; /* Added spacing between the two links */
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
        }
        a {
            font-size: 2rem;
            text-decoration: none;
            color: #d42426;
            border: 2px solid #d42426;
            padding: 15px 30px;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
        }
        a:hover {
            background-color: #d42426;
            color: white;
        }
    </style>
</head>
<body>

    <a href="https://isitchristmas.com">Is it Christmas?</a>

    <a href="https://isitchristmas.com" target="_blank">Is it Christmas? (target _blank)</a>

    <a href="https://isitchristmas.com" target="_blank" rel="noreferrer">Is it Christmas? (New Tab, No Referrer)</a>

    <a href="https://isitchristmas.com" target="_blank" rel="noopener noreferrer">Is it Christmas? (New Tab, No Opener, No Referrer)</a>

</body>
</html>
